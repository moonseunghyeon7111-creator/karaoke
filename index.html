<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>우리집 노래방</title>
<meta name="theme-color" content="#0e1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="노래방">
<meta name="application-name" content="노래방">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0e1020;--card:#181b33;--card2:#20244a;--line:#2c3166;--text:#f3f4ff;--sub:#a9aed6;--pink:#ff4fa3;--cyan:#33d6ff;--gold:#ffd24a;--green:#3ddc97}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.gear{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;white-space:nowrap;font-size:.85rem}
@media(max-width:480px){h1{font-size:1.25rem}}
.notice{margin-top:12px;background:#3a2a00;border:1px solid #806000;color:#ffe08a;border-radius:12px;padding:10px 12px;font-size:.9rem;line-height:1.5}
.brand{display:flex;gap:6px;align-items:center;margin-top:12px;font-size:.9rem;color:var(--sub);flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}
.search{margin-top:14px}
.search input{width:100%;padding:16px 18px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.15rem;outline:none}
.search input:focus{border-color:var(--cyan)}
.hint{font-size:.85rem;color:var(--sub);margin:6px 4px 0}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.sortbar{display:flex;justify-content:space-between;align-items:center;margin:8px 2px;font-size:.9rem;color:var(--sub)}
.sortbar select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.song{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.top{display:flex;gap:12px;align-items:flex-start}
.no{font-family:ui-monospace,Menlo,monospace;color:var(--cyan);font-weight:700;min-width:3.2em;padding-top:2px}
.info{flex:1;min-width:0}
.t{font-size:1.2rem;font-weight:700;word-break:keep-all}
.a{color:var(--sub);font-size:.92rem;margin-top:2px}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:4px;color:var(--sub)}
.tag.link{color:var(--green);border-color:var(--green)}
.star{background:none;border:none;font-size:1.6rem;cursor:pointer;color:var(--sub);padding:0 4px;line-height:1}
.star.on{color:var(--gold)}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;text-align:center;padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer;text-decoration:none;color:var(--text);font-weight:600;display:block}
.btn.play{background:linear-gradient(90deg,var(--pink),#ff7a59);border:none;color:#fff;flex:1.4}
.btn.small{flex:0 0 auto;padding:12px 14px}
.yt{margin-top:10px;background:#c4302b!important;border:none!important;color:#fff!important;padding:14px 10px}
.empty{text-align:center;color:var(--sub);padding:30px 10px;line-height:1.7}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(14,16,32,.96);border-top:1px solid var(--line);z-index:5}
.bar .in{max-width:820px;margin:0 auto;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar .btn{padding:14px 8px}
.next{background:var(--cyan)!important;color:#08101f!important;border:none!important;font-weight:800}
.next.off{opacity:.4;pointer-events:none}
.fab{background:var(--green)!important;color:#08101f!important;border:none!important;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--card);width:100%;max-width:820px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:1.3rem}
label{display:block;font-size:.9rem;color:var(--sub);margin:12px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none}
.sheet textarea{height:90px;font-size:.75rem}
.help{font-size:.82rem;color:var(--sub);line-height:1.6;margin-top:6px}
.row{display:flex;gap:8px;margin-top:16px}
.q{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.q .n{color:var(--pink);font-weight:800;min-width:1.6em}
.q .x{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#111;padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.danger{background:#5a1630!important;border-color:#8a2148!important}
/* player */
#player{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column}
#player.on{display:flex}
.pbar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#111;flex-wrap:wrap}
.pbar .ttl{flex:1;min-width:150px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar button,.pbar a{background:#222;border:1px solid #444;border-radius:10px;padding:10px 12px;cursor:pointer;color:#fff;text-decoration:none;font-weight:600;font-size:.95rem}
.pbar .nx{background:var(--cyan);color:#08101f;border:none}
#pv{flex:1;position:relative}
#pv iframe,#ytp{position:absolute;inset:0;width:100%;height:100%;border:0}
#pmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;color:#ddd;line-height:1.6;pointer-events:none}
#pmsg a,#pmsg button{pointer-events:auto}
#pmsg .btn{flex:none;width:auto;padding:14px 26px;display:inline-block}
#pmsg.cover{background:#000}
.btn.inapp{background:#1d3b5c;border-color:#2f5f8f}
.pnext{font-size:.85rem;color:#aaa;padding:6px 10px;background:#111}
.pbar .rec{background:#7a1f3d;border-color:#b0305c}
.pbar .rec.on{background:#e0245e;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}
.recitem{padding:12px 0;border-bottom:1px solid var(--line)}
.recitem audio{width:100%;margin-top:8px}
.recrow{display:flex;gap:8px;margin-top:8px}
.recrow .btn{padding:10px 8px;font-size:.9rem}
</style></head><body>

"","f":false},{"id":"s1181","no":1181,"t":"Dynamite","a":"방탄소년단","c":"댄스","v":"","f":false},{"id":"s1182","no":1182,"t":"APT.","a":"로제, Bruno Mars","c":"댄스","v":"","f":false},{"id":"s1183","no":1183,"t":"Dancing Queen","a":"ABBA","c":"팝송","v":"","f":false},{"id":"s1184","no":1184,"t":"Mamma Mia","a":"ABBA","c":"팝송","v":"","f":false},{"id":"s1185","no":1185,"t":"Yesterday Once More","a":"Carpenters","c":"팝송","v":"","f":false},{"id":"s1186","no":1186,"t":"Top of the World","a":"Carpenters","c":"팝송","v":"","f":false},{"id":"s1187","no":1187,"t":"Bohemian Rhapsody","a":"Queen","c":"팝송","v":"","f":false},{"id":"s1188","no":1188,"t":"I Will Always Love You","a":"Whitney Houston","c":"팝송","v":"","f":false},{"id":"s1189","no":1189,"t":"My Heart Will Go On","a":"Celine Dion","c":"팝송","v":"","f":false},{"id":"s1190","no":1190,"t":"Hello","a":"Lionel Richie","c":"팝송","v":"","f":false},{"id":"s1191","no":1191,"t":"I Just Called to Say I Love You","a":"Stevie Wonder","c":"팝송","v":"","f":false},{"id":"s1192","no":1192,"t":"Love Me Tender","a":"Elvis Presley","c":"팝송","v":"","f":false},{"id":"s1193","no":1193,"t":"Hey Jude","a":"The Beatles","c":"팝송","v":"","f":false},{"id":"s1194","no":1194,"t":"Bridge over Troubled Water","a":"Simon & Garfunkel","c":"팝송","v":"","f":false},{"id":"s1195","no":1195,"t":"What a Wonderful World","a":"Louis Armstrong","c":"팝송","v":"","f":false},{"id":"s1196","no":1196,"t":"How Deep Is Your Love","a":"Bee Gees","c":"팝송","v":"","f":false},{"id":"s1197","no":1197,"t":"Billie Jean","a":"Michael Jackson","c":"팝송","v":"","f":false},{"id":"s1198","no":1198,"t":"My Love","a":"Westlife","c":"팝송","v":"","f":false},{"id":"s1199","no":1199,"t":"Delilah","a":"Tom Jones","c":"팝송","v":"","f":false},{"id":"s1200","no":1200,"t":"Mr. Lonely","a":"Bobby Vinton","c":"팝송","v":"","f":false}]}</script>
<script>
(function(){
var CATS=['트로트','발라드','7080','댄스','팝송','기타'];
var BRAND_LABEL={TJ:'태진(TJ)',KY:'금영(KY)'};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
var base=JSON.parse(document.getElementById('data').textContent);
var state=base;
try{var sv=JSON.parse(ls('k2_state')||'null');if(sv&&sv.songs){var ids={};sv.songs.forEach(function(s){ids[s.id]=s;});
  base.songs.forEach(function(b){var s=ids[b.id];if(!s){if(!sv.deleted||sv.deleted.indexOf(b.id)<0)sv.songs.push(b);}else if(b.vt&&!s.vt)s.vt=b.vt;});
  sv.nextNo=Math.max(sv.nextNo||0,base.nextNo);state=sv;}}catch(e){}
state.deleted=state.deleted||[];
state.brand=ls('k2_brand')==='KY'?'KY':'TJ';
var apiKey=ls('k2_key')||'';
var ui={q:'',cat:'전체',sort:'no',modal:null,edit:null,confirmDel:false};
var queue=[];try{queue=JSON.parse(ls('k2_queue')||'[]');}catch(e){}
var root=document.getElementById('root');

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
var SPLIT={'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'};
var JAMO1='ᄀᄁᄂᄃᄄᄅᄆᄇᄈᄉᄊᄋᄌᄍᄎᄏᄐᄑᄒ';
function cho(s){var o='';for(var i=0;i<s.length;i++){var k=s.charCodeAt(i)-0xAC00;o+=(k>=0&&k<11172)?CHO[Math.floor(k/588)]:s[i];}return o;}
function fixQ(q){q=String(q);if(q.normalize)q=q.normalize('NFC');var o='';for(var i=0;i<q.length;i++){var c=q[i];var k=JAMO1.indexOf(c);if(k>=0)c=CHO[k];o+=SPLIT[c]||c;}return o;}
function norm(s){return String(s).toLowerCase().replace(/\s+/g,'');}
function isCho(c){return CHO.indexOf(c)>=0;}
function match(song,q){if(!q)return true;q=norm(fixQ(q));var hay=norm(song.t+' '+song.a+' '+song.no);if(hay.indexOf(q)>=0)return true;
  var has=false;for(var j=0;j<q.length;j++)if(isCho(q[j])){has=true;break;}if(!has)return false;var hc=cho(hay);
  for(var i=0;i+q.length<=hay.length;i++){var ok=true;for(var j2=0;j2<q.length;j2++){var qc=q[j2];if(isCho(qc)?hc[i+j2]!==qc:hay[i+j2]!==qc){ok=false;break;}}if(ok)return true;}return false;}
function vid(url){url=(url||'').trim();if(/^[\w-]{11}$/.test(url))return url;var m=url.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);return m?m[1]:'';}
function byId(id){for(var i=0;i<state.songs.length;i++)if(state.songs[i].id===id)return state.songs[i];return null;}
function knownId(s){if(s.v)return s.v;return state.brand==='KY'?s.vk:s.vt;}
function searchQ(t,a){return state.brand==='KY'?(t+(a?' - '+a:'')+' KY 금영노래방'):('[TJ노래방] '+t+(a?' - '+a:''));}
function ytSearchUrl(t,a){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(searchQ(t,a));}
function save(){try{localStorage.setItem('k2_state',JSON.stringify(state));}catch(e){}}
function saveQueue(){ls('k2_queue',JSON.stringify(queue));}
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove();},2400);}

/* ---------- list ---------- */
function rank(s){if(!ui.q)return 0;var q=norm(fixQ(ui.q));if(norm(s.a)===q)return 0;if(norm(s.a).indexOf(q)>=0)return 1;if(norm(s.t).indexOf(q)>=0)return 2;return 3;}
function list(){
  var arr=state.songs.filter(function(s){
    if(ui.cat==='⭐ 즐겨찾기'&&!s.f)return false;
    if(ui.cat!=='전체'&&ui.cat!=='⭐ 즐겨찾기'&&s.c!==ui.cat)return false;
    return match(s,ui.q);});
  arr.sort(function(x,y){
    if(ui.sort==='t')return x.t.localeCompare(y.t,'ko');
    if(ui.sort==='a')return x.a.localeCompare(y.a,'ko')||x.t.localeCompare(y.t,'ko');
    return rank(x)-rank(y)||x.no-y.no;});
  return arr;
}
function listHTML(){
  var arr=list();var h='';var q=ui.q.trim();
  if(q)h+='<button class="btn yt" data-act="freeplay">▶ "'+esc(q)+'" 바로 부르기 ('+BRAND_LABEL[state.brand]+' 영상, 유튜브로)</button><button class="btn inapp" style="margin-top:8px;padding:12px" data-act="freeapp">📺 "'+esc(q)+'" 앱 안에서 부르기 (일반 반주 영상)</button>';
  h+='<div class="sortbar"><span>'+arr.length+'곡</span><select id="sort"><option value="no"'+(ui.sort==='no'?' selected':'')+'>번호순</option><option value="t"'+(ui.sort==='t'?' selected':'')+'>제목 가나다순</option><option value="a"'+(ui.sort==='a'?' selected':'')+'>가수별</option></select></div>';
  if(!arr.length){h+='<div class="empty">찾는 노래가 노래책에 없어요.<br>위의 빨간 버튼으로 바로 부르거나,<br><br><button class="btn" style="display:inline-block;padding:12px 20px" data-act="add">＋ 노래책에 추가하기</button></div>';}
  arr.forEach(function(s){
    var k=knownId(s);
    h+='<div class="song"><div class="top"><div class="no">'+s.no+'</div><div class="info"><div class="t">'+esc(s.t)+'</div><div class="a">'+esc(s.a)+'<span class="tag">'+esc(s.c)+'</span>'+(k?'<span class="tag link">바로 재생</span>':'')+'</div></div>';
    h+='<button class="star'+(s.f?' on':'')+'" data-fav="'+s.id+'" aria-label="즐겨찾기">'+(s.f?'★':'☆')+'</button></div>';
    h+='<div class="acts"><button class="btn play" data-play="'+s.id+'">▶ 부르기</button><button class="btn inapp" data-app="'+s.id+'">📺 앱에서</button><button class="btn" data-rsv="'+s.id+'">＋ 예약</button><button class="btn small" data-edit="'+s.id+'" aria-label="수정">✎</button></div></div>';
  });
  return h;
}
function render(){
  var h='<div class="wrap"><header><h1>🎤 <span>우리집 노래방</span></h1><div style="display:flex;gap:6px"><button class="gear" data-act="recs">🎙 내 녹음</button><button class="gear" data-act="settings">⚙ 설정</button></div></header>';
  if(!apiKey)h+='<div class="notice">⚙ 설정에서 <b>API 키</b>를 넣으면 "부르기"를 누를 때 태진/금영 영상이 검색 없이 바로 열리고, "📺 앱에서"도 쓸 수 있어요.</div>';
  h+='<div class="brand">노래방 영상: ';
  ['TJ','KY'].forEach(function(b){h+='<button class="chip'+(state.brand===b?' on':'')+'" data-brand="'+b+'">'+BRAND_LABEL[b]+'</button>';});
  h+='</div><div class="search"><input id="q" type="search" placeholder="🔍 노래 제목, 가수, 번호 검색" value="'+esc(ui.q)+'" autocomplete="off"></div>';
  h+='<div class="hint">초성 검색도 돼요: 예) ㄴㅎㅇㅊ → 남행열차, ㄴㅎㅇ → 나훈아</div><div class="cats">';
  ['전체','⭐ 즐겨찾기'].concat(CATS).forEach(function(c){h+='<button class="chip'+(ui.cat===c?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';});
  h+='</div><div id="lw">'+listHTML()+'</div></div>';
  var first=queue.length?byId(queue[0]):null;
  h+='<div class="bar"><div class="in"><button class="btn" data-act="queue">📋 예약 '+queue.length+'곡</button>';
  h+='<button class="btn next'+(first?'':' off')+'" data-act="next">'+(first?'▶ 다음 곡: '+esc(first.t):'예약곡 없음')+'</button>';
  h+='<button class="btn fab small" data-act="add">＋ 곡 추가</button></div></div>';
  if(ui.modal==='queue')h+=queueModal();
  if(ui.modal==='form')h+=formModal();
  if(ui.modal==='settings')h+=settingsModal();
  if(ui.modal==='recs')h+=recsModal();
  root.innerHTML=h;
}
function refreshList(){var lw=document.getElementById('lw');if(lw)lw.innerHTML=listHTML();}
function queueModal(){
  var h='<div class="modal" data-act="close"><div class="sheet"><h2>📋 예약 목록</h2>';
  if(!queue.length)h+='<div class="empty">예약된 노래가 없어요.<br>노래 옆 "＋ 예약"을 눌러 주세요.</div>';
  queue.forEach(function(id,i){var s=byId(id);if(!s)return;
    h+='<div class="q"><div class="n">'+(i+1)+'</div><div class="info"><div class="t" style="font-size:1.05rem">'+esc(s.t)+'</div><div class="a">'+esc(s.a)+'</div></div>'+(i>0?'<button class="x" data-up="'+i+'">▲</button>':'')+'<button class="x" data-rm="'+i+'">취소</button></div>';});
  h+='<div class="row">'+(queue.length?'<button class="btn danger" data-act="clearq">모두 취소</button>':'')+'<button class="btn" data-act="close">닫기</button></div></div></div>';
  return h;
}
function formModal(){
  var s=ui.edit?byId(ui.edit):{t:ui.q||'',a:'',c:'트로트',v:''};
  var h='<div class="modal" data-act="close"><div class="sheet"><h2>'+(ui.edit?'노래 수정':'노래책에 곡 추가')+'</h2>';
  h+='<label>노래 제목 *</label><input id="f_t" value="'+esc(s.t)+'" placeholder="예) 남행열차">';
  h+='<label>가수</label><input id="f_a" value="'+esc(s.a)+'" placeholder="예) 김수희">';
  h+='<label>분류</label><select id="f_c">'+CATS.map(function(c){return '<option'+(s.c===c?' selected':'')+'>'+c+'</option>';}).join('')+'</select>';
  h+='<label>유튜브 영상 링크 (선택)</label><input id="f_v" value="'+(s.v?'https://youtu.be/'+esc(s.v):'')+'" placeholder="비워두면 자동으로 찾아요">';
  h+='<div class="help">비워두면 "부르기"를 누를 때 태진/금영 영상을 자동으로 찾아줘요. 항상 같은 영상을 틀고 싶을 때만 링크를 넣으세요.</div><div class="row">';
  if(ui.edit)h+='<button class="btn danger" data-act="del">'+(ui.confirmDel?'정말 삭제할까요?':'삭제')+'</button>';
  h+='<button class="btn" data-act="close">취소</button><button class="btn play" data-act="savef">저장</button></div></div></div>';
  return h;
}
function settingsModal(){
  var h='<div class="modal" data-act="close"><div class="sheet"><h2>⚙ 설정</h2>';
  h+='<label>유튜브 API 키</label><input id="s_key" value="'+esc(apiKey)+'" placeholder="AIza로 시작하는 키를 붙여넣으세요" autocomplete="off">';
  h+='<div class="help">바탕화면의 "노래방 API 키" 메모장에서 복사해 붙여넣고 저장하세요. 키는 이 기기에만 저장돼요. 휴대폰과 노트북에 각각 한 번씩 넣어 주세요.</div>';
  h+='<div class="row"><button class="btn" data-act="close">닫기</button><button class="btn play" data-act="savekey">저장</button></div>';
  h+='<label style="margin-top:24px">노래책 백업 (다른 기기로 옮기기)</label><textarea id="s_bak" readonly>'+esc(JSON.stringify({songs:state.songs,nextNo:state.nextNo,deleted:state.deleted}))+'</textarea>';
  h+='<div class="help">위 글자를 모두 복사해서 다른 기기의 아래 칸에 붙여넣고 "불러오기"를 누르면 즐겨찾기와 추가한 곡이 옮겨져요.</div>';
  h+='<label>백업 불러오기</label><textarea id="s_imp" placeholder="여기에 붙여넣기"></textarea><div class="row"><button class="btn" data-act="import">불러오기</button></div></div></div>';
  return h;
}
function saveForm(){
  var t=document.getElementById('f_t').value.trim();if(!t){toast('노래 제목을 입력해 주세요');return;}
  var a=document.getElementById('f_a').value.trim(),c=document.getElementById('f_c').value,raw=document.getElementById('f_v').value.trim(),v=vid(raw);
  if(raw&&!v){toast('유튜브 링크를 확인해 주세요');return;}
  if(ui.edit){var s=byId(ui.edit);if(s.t!==t||s.a!==a){s.vt='';s.vk='';s.ve2='';}s.t=t;s.a=a;s.c=c;s.v=v;toast('수정했어요');}
  else{var no=state.nextNo||1001;state.nextNo=no+1;state.songs.push({id:'u'+Date.now(),no:no,t:t,a:a,c:c,v:v,f:false});toast(no+'번으로 추가했어요');ui.q='';}
  ui.modal=null;ui.edit=null;save();render();
}

/* ---------- player ---------- */
var P=document.getElementById('player'),yt=null,ytReady=false,ytWait=[],cur=null;
function loadYT(cb){if(ytReady)return cb();ytWait.push(cb);if(window._ytl)return;window._ytl=1;
  window.onYouTubeIframeAPIReady=function(){ytReady=true;ytWait.splice(0).forEach(function(f){f();});};
  var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);}
function pmsg(html,cover){var m=document.getElementById('pmsg');m.innerHTML=html||'';m.classList.toggle('cover',!!cover);}
function updNext(){var n=queue.length?byId(queue[0]):null;document.getElementById('pnext').textContent=n?'다음 예약곡: '+n.t+' - '+n.a+' (총 '+queue.length+'곡)':'예약곡 없음';
  document.getElementById('pnx').style.display=n?'':'none';}
function openPlayer(title){P.classList.add('on');document.getElementById('pttl').textContent='🎤 '+title;updNext();}
function closePlayer(){stopRec();P.classList.remove('on');if(yt&&yt.stopVideo)try{yt.stopVideo();}catch(e){}cur=null;pmsg('');if(document.fullscreenElement)document.exitFullscreen().catch(function(){});render();}
function playId(id){
  document.getElementById('pyt').href='https://www.youtube.com/watch?v='+id;pmsg('',false);
  loadYT(function(){
    if(!yt){yt=new YT.Player('ytp',{videoId:id,playerVars:{autoplay:1,playsinline:1,rel:0},events:{onStateChange:onState,onError:onErr}});}
    else yt.loadVideoById(id);
  });
}
function onState(e){if(e.data===0){stopRec(); if(queue.length){pmsg('<div style="font-size:1.4rem">다음 곡으로 넘어가요…</div>');setTimeout(playNext,2500);} else pmsg('<div style="font-size:1.3rem">노래가 끝났어요 👏</div><button class="btn" onclick="document.getElementById(\'pclose\').click()">노래책으로 돌아가기</button>',true); }}
function onErr(e){
  if(cur&&cur.song&&cur.song.ve2===cur.id){cur.song.ve2='';save();}
  if(cur&&cur.cands&&cur.cands.length){var n=cur.cands.shift();cur.id=n;if(cur.song){cur.song.ve2=n;save();}pmsg('<div>이 영상은 재생이 막혀 있어서 다른 영상을 찾고 있어요…</div>',true);playId(n);return;}
  pmsg('<div>앱 안에서 재생할 수 있는 영상이 없어요.</div><a class="btn yt" target="_blank" rel="noopener" href="'+(cur?ytSearchUrl(cur.t,cur.a):'#')+'">유튜브에서 '+BRAND_LABEL[state.brand]+' 영상 보기</a>',true);
}
function apiCall(q,embed,max){
  var url='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults='+(max||8)+(embed?'&videoEmbeddable=true':'')+'&q='+encodeURIComponent(q)+'&key='+encodeURIComponent(apiKey);
  return fetch(url).then(function(r){return r.json().then(function(j){if(!r.ok){var rs=(j.error&&j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason)||'';throw new Error(rs||('http'+r.status));}return j.items||[];});});
}
var BLOCKED=/TJ|KY|금영|keumyoung|ziller|태진/i;
function brandIds(t,a){var re=state.brand==='KY'?/KY|금영|keumyoung/i:/TJ|ziller|태진/i;
  return apiCall(searchQ(t,a),false).then(function(it){var good=it.filter(function(x){return re.test(x.snippet.channelTitle)||re.test(x.snippet.title);});return (good.length?good:it).map(function(x){return x.id.videoId;});});}
var KARA=/노래방|karaoke|가라오케/i,MRW=/\bMR\b|반주|instrumental|\binst\b|인스트/i,NOTK=/cover|커버|live|라이브|직캠|무대|fancam|reaction|리액션|뮤직비디오|m\/v|\bmv\b|official (music )?video|full ver|풀버전|audio/i;
function embedIds(t,a){
  var nt=norm(t);
  return apiCall(t+(a?' '+a:'')+' 노래방 MR',true,25).then(function(it){
    var list=it.filter(function(x){return !BLOCKED.test(x.snippet.channelTitle);}).map(function(x){var ti=x.snippet.title.replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"');
      var k=KARA.test(ti),m=MRW.test(ti),bad=NOTK.test(ti)&&!k;var hasT=norm(ti).indexOf(nt)>=0;
      var sc=(k?3:0)+(m?2:0)+(hasT?2:0)-(bad?5:0);return {id:x.id.videoId,sc:sc,ok:(k||m)&&!bad};});
    list=list.filter(function(x){return x.ok;}).sort(function(p,q){return q.sc-p.sc;});
    return list.map(function(x){return x.id;});});}
function whyErr(err){var r=String(err&&err.message||err);
  return /quota/i.test(r)?'오늘 자동 검색 횟수를 다 썼어요. 내일 다시 돼요.':/keyInvalid|API key|badRequest|forbidden|ipRefererBlocked|accessNotConfigured|http4/i.test(r)?'API 키가 맞지 않아요. ⚙ 설정을 확인해 주세요.':'인터넷 연결을 확인해 주세요.';}
/* A: 태진/금영 영상을 찾아 유튜브로 바로 열기 */
function play(song,freeQ){
  var t=song?song.t:freeQ,a=song?song.a:'';
  var k=song?knownId(song):'';
  if(k){window.open('https://www.youtube.com/watch?v='+k,'_blank');return;}
  if(!apiKey){window.open(ytSearchUrl(t,a),'_blank');return;}
  var w=window.open('about:blank','_blank');
  try{w.document.write('<body style="background:#0e1020;color:#fff;font:20px sans-serif;display:flex;align-items:center;justify-content:center;height:90vh">🎤 '+BRAND_LABEL[state.brand]+' 영상을 찾고 있어요…</body>');}catch(e){}
  function go(u){if(w&&!w.closed)w.location.href=u;else location.href=u;}
  brandIds(t,a).then(function(ids){
    if(!ids.length){go(ytSearchUrl(t,a));return;}
    if(song&&!song.v){if(state.brand==='KY')song.vk=ids[0];else song.vt=ids[0];save();refreshList();}
    go('https://www.youtube.com/watch?v='+ids[0]);
  }).catch(function(err){toast(whyErr(err));go(ytSearchUrl(t,a));});
}
/* B: 앱 안에서 재생 (일반 반주 영상) */
function playApp(song,freeQ){
  var t=song?song.t:freeQ,a=song?song.a:'';
  if(!apiKey){toast('⚙ 설정에서 API 키를 먼저 넣어 주세요');ui.modal='settings';render();return;}
  cur={song:song,t:t,a:a,id:song&&song.ve2||'',cands:[]};
  openPlayer(t+(a?' - '+a:''));
  if(cur.id){playId(cur.id);return;}
  pmsg('<div style="font-size:1.2rem">앱 안에서 재생할 반주 영상을 찾고 있어요…</div>',true);
  var mine=cur;
  embedIds(t,a).then(function(ids){
    if(cur!==mine)return;
    if(!ids.length){pmsg('<div>앱 안에서 재생할 수 있는 <b>노래방 반주 영상</b>을 찾지 못했어요.<br>"▶ 부르기"로 태진·금영 영상을 이용해 주세요.</div><a class="btn yt" target="_blank" rel="noopener" href="'+ytSearchUrl(t,a)+'">유튜브에서 '+BRAND_LABEL[state.brand]+' 영상 보기</a>',true);return;}
    cur.id=ids[0];cur.cands=ids.slice(1,5);
    if(song){song.ve2=ids[0];save();}
    playId(ids[0]);
  }).catch(function(err){if(cur!==mine)return;pmsg('<div>'+whyErr(err)+'</div><a class="btn yt" target="_blank" rel="noopener" href="'+ytSearchUrl(t,a)+'">유튜브에서 열기</a>',true);});
}
function playNext(){stopRec();if(!queue.length)return;var id=queue.shift();saveQueue();var s=byId(id);updNext();if(!s)return;if(P.classList.contains('on'))playApp(s);else{play(s);render();}}
document.getElementById('pclose').onclick=closePlayer;
document.getElementById('pnx').onclick=playNext;
document.getElementById('pfs').onclick=function(){if(document.fullscreenElement)document.exitFullscreen().catch(function(){});else if(P.requestFullscreen)P.requestFullscreen().catch(function(){});};

/* ---------- 녹음 ---------- */
var DB=null;
function db(){return new Promise(function(res,rej){if(DB)return res(DB);var r=indexedDB.open('karaoke_rec',1);r.onupgradeneeded=function(){r.result.createObjectStore('recs',{keyPath:'id'});};r.onsuccess=function(){DB=r.result;res(DB);};r.onerror=function(){rej(r.error);};});}
function dbAll(){return db().then(function(d){return new Promise(function(res){var out=[];d.transaction('recs').objectStore('recs').openCursor().onsuccess=function(e){var c=e.target.result;if(c){out.push(c.value);c.continue();}else res(out.sort(function(a,b){return b.id-a.id;}));};});});}
function dbPut(v){return db().then(function(d){return new Promise(function(res){var t=d.transaction('recs','readwrite');t.objectStore('recs').put(v);t.oncomplete=res;});});}
function dbDel(id){return db().then(function(d){return new Promise(function(res){var t=d.transaction('recs','readwrite');t.objectStore('recs').delete(id);t.oncomplete=res;});});}
var rec=null,recChunks=[],recStream=null,recStart=0,recTimer=null,recTitle='';
var RB=document.getElementById('prec');
function recLabel(){if(!rec){RB.textContent='🎙 녹음';RB.classList.remove('on');return;}var s=Math.floor((Date.now()-recStart)/1000);RB.textContent='⏹ 녹음 중 '+Math.floor(s/60)+':'+('0'+s%60).slice(-2);RB.classList.add('on');}
function startRec(){
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('이 기기에서는 녹음을 쓸 수 없어요');return;}
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}}).then(function(st){
    recStream=st;recChunks=[];
    var mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac'].filter(function(t){return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t);})[0];
    rec=mt?new MediaRecorder(st,{mimeType:mt}):new MediaRecorder(st);
    rec.ondataavailable=function(e){if(e.data&&e.data.size)recChunks.push(e.data);};
    rec.onstop=saveRec;
    recTitle=document.getElementById('pttl').textContent.replace('🎤 ','');
    rec.start(1000);recStart=Date.now();recLabel();recTimer=setInterval(recLabel,1000);
    toast('녹음을 시작했어요. 노래 부르세요! 🎤');
  }).catch(function(){toast('마이크 사용을 허용해 주세요. 주소창 왼쪽 아이콘 → 마이크 → 허용');});
}
function stopRec(){if(rec&&rec.state!=='inactive')rec.stop();}
function saveRec(){
  clearInterval(recTimer);var dur=Math.round((Date.now()-recStart)/1000);
  if(recStream)recStream.getTracks().forEach(function(t){t.stop();});
  var type=(rec&&rec.mimeType)||'audio/webm';rec=null;recLabel();
  if(dur<2||!recChunks.length){return;}
  var blob=new Blob(recChunks,{type:type});
  dbPut({id:Date.now(),title:recTitle,dur:dur,type:type,blob:blob}).then(function(){toast('녹음을 저장했어요. 🎙 내 녹음에서 들을 수 있어요');}).catch(function(){toast('녹음을 저장하지 못했어요');});
}
RB.onclick=function(){if(rec)stopRec();else startRec();};
var recUrls=[];
function fmtDur(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function recsModal(){return '<div class="modal" data-act="close"><div class="sheet"><h2>🎙 내 녹음</h2><div id="reclist" class="help">불러오는 중…</div><div class="row"><button class="btn" data-act="close">닫기</button></div></div></div>';}
function fillRecs(){
  recUrls.forEach(function(u){URL.revokeObjectURL(u);});recUrls=[];
  dbAll().then(function(list){var el=document.getElementById('reclist');if(!el)return;
    if(!list.length){el.innerHTML='아직 녹음이 없어요.<br>노래를 <b>📺 앱에서</b>로 틀고, 위쪽 <b>🎙 녹음</b> 버튼을 누르면 녹음돼요.';return;}
    var h='';list.forEach(function(r){var u=URL.createObjectURL(r.blob);recUrls.push(u);var d=new Date(r.id);
      var ext=/mp4|aac/.test(r.type)?'m4a':'webm';var fn=(r.title||'노래').replace(/[\\/:*?"<>|]/g,'')+'_'+d.getFullYear()+(d.getMonth()+1)+d.getDate()+'.'+ext;
      h+='<div class="recitem"><div class="t" style="font-size:1.05rem">'+esc(r.title||'노래')+'</div><div class="a">'+d.toLocaleString('ko-KR')+' · '+fmtDur(r.dur)+'</div><audio controls preload="metadata" src="'+u+'"></audio><div class="recrow"><a class="btn" href="'+u+'" download="'+esc(fn)+'">💾 파일로 저장</a><button class="btn danger" data-recdel="'+r.id+'">삭제</button></div></div>';});
    el.className='';el.innerHTML=h;
  }).catch(function(){var el=document.getElementById('reclist');if(el)el.textContent='녹음을 불러오지 못했어요.';});
}
/* ---------- events ---------- */
root.addEventListener('click',function(e){
  var el=e.target.closest('[data-brand],[data-cat],[data-fav],[data-rsv],[data-edit],[data-act],[data-rm],[data-up],[data-play],[data-app],[data-recdel]');
  if(!el)return;var d=el.dataset;
  if(d.act==='close'&&el.classList.contains('modal')&&e.target!==el)return;
  if(d.recdel){if(el.dataset.sure){dbDel(+d.recdel).then(fillRecs);toast('녹음을 삭제했어요');}else{el.dataset.sure='1';el.textContent='정말 삭제?';}return;}
  if(d.play){var s=byId(d.play);if(s)play(s);return;}
  if(d.app){var sa=byId(d.app);if(sa)playApp(sa);return;}
  if(d.brand){state.brand=d.brand;ls('k2_brand',d.brand);render();return;}
  if(d.cat){ui.cat=d.cat;render();return;}
  if(d.fav){var s2=byId(d.fav);s2.f=!s2.f;save();el.classList.toggle('on',s2.f);el.textContent=s2.f?'★':'☆';return;}
  if(d.rsv){queue.push(d.rsv);saveQueue();toast('예약했어요 ('+queue.length+'번째)');render();return;}
  if(d.edit){ui.edit=d.edit;ui.modal='form';ui.confirmDel=false;render();return;}
  if(d.rm!==undefined){queue.splice(+d.rm,1);saveQueue();render();return;}
  if(d.up!==undefined){var i=+d.up,x=queue[i];queue[i]=queue[i-1];queue[i-1]=x;saveQueue();render();return;}
  switch(d.act){
    case 'freeplay':play(null,ui.q.trim());break;
    case 'freeapp':playApp(null,ui.q.trim());break;
    case 'queue':ui.modal='queue';render();break;
    case 'settings':ui.modal='settings';render();break;
    case 'recs':ui.modal='recs';render();fillRecs();break;
    case 'add':ui.edit=null;ui.modal='form';render();break;
    case 'close':ui.modal=null;ui.edit=null;render();break;
    case 'clearq':queue=[];saveQueue();render();break;
    case 'savef':saveForm();break;
    case 'savekey':apiKey=document.getElementById('s_key').value.trim();ls('k2_key',apiKey);ui.modal=null;toast(apiKey?'API 키를 저장했어요':'API 키를 지웠어요');render();break;
    case 'import':try{var j=JSON.parse(document.getElementById('s_imp').value);if(!j.songs)throw 0;state.songs=j.songs;state.nextNo=j.nextNo||state.nextNo;state.deleted=j.deleted||[];save();ui.modal=null;toast('노래책을 불러왔어요');render();}catch(err){toast('백업 글자가 올바르지 않아요');}break;
    case 'del':if(!ui.confirmDel){ui.confirmDel=true;render();break;}
      state.songs=state.songs.filter(function(s){return s.id!==ui.edit;});state.deleted.push(ui.edit);
      queue=queue.filter(function(id){return id!==ui.edit;});saveQueue();ui.modal=null;ui.edit=null;toast('삭제했어요');save();render();break;
    case 'next':playNext();break;
  }
});
var qt=null;
function refreshQ(){var el=document.getElementById('q');if(!el)return;ui.q=el.value;refreshList();}
['input','keyup','compositionend','change','search'].forEach(function(ev){root.addEventListener(ev,function(e){if(e.target.id==='q'){clearTimeout(qt);qt=setTimeout(refreshQ,120);}});});
root.addEventListener('keydown',function(e){if(e.target.id==='q'&&e.key==='Enter'){e.target.blur();refreshQ();}});
root.addEventListener('change',function(e){if(e.target.id==='sort'){ui.sort=e.target.value;refreshList();}});
render();
})();
</script></body></html>
